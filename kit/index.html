<!doctype html>
<html lang="ru" class="light" data-theme="light">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Палаццо де Агой · комплект носителей</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/heroui.min.css?v=12">
<link rel="stylesheet" href="/ui.css?v=13">
<link rel="stylesheet" href="/media.css?v=4">
<body class="p-kit">
<div class="shell">
  <header class="top">
    <div class="top__l"><h1 class="brand"><a href="/" data-tip="Ко всем носителям"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg>Палаццо де Агой</a></h1></div>
    <div class="top__r"><span class="chip mono">Комплект</span></div>
  </header>
  <section class="stagebox stage" id="stage" aria-label="Все носители на одном столе">
    <canvas id="gl"></canvas>
    <div class="hint">Тяните, чтобы повернуть стол · колесо — масштаб · нажмите на носитель, чтобы открыть</div>
    <div class="now"><span class="cnt" id="cnt"></span><strong>Комплект</strong><span class="nt" id="note"></span></div>
    <div class="nogl" id="nogl" hidden>Браузер не смог запустить WebGL, 3D-сцена недоступна.</div>
    <div class="viewbar glass pill" role="toolbar" aria-label="Отделка комплекта" id="bar">
      <span class="separator separator--vertical" aria-hidden="true"></span>
      <button type="button" class="toggle-button toggle-button--sm toggle-button--ghost" id="studio" aria-pressed="false">Тёмный фон</button>
      <span class="separator separator--vertical" aria-hidden="true"></span>
      <button type="button" class="button button--icon-only button--sm button--ghost" id="zout" aria-label="Отдалить"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M3 8h10"/></svg></button>
      <button type="button" class="button button--icon-only button--sm button--ghost" id="zin" aria-label="Приблизить"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M8 3v10M3 8h10"/></svg></button>
    </div>
  </section>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="/api/catalog"></script>
<script src="/vendor/GLTFLoader.js"></script>
<script src="/media.js?v=7"></script>
<script>
(function () {
  'use strict';
  var P = window.PDA, T = window.THREE, $ = function (id) { return document.getElementById(id); };
  P.mountNav(document.querySelector('.top__l'), null);
  /* Раскладка на столе, в сантиметрах сцены: [носитель, x, z, поворот, стоит ли вертикально] */
  var LAYOUT = [
    ['booklet', -0.2, -3.15, 0.04, false], ['letterhead', -2.75, 0.25, 0.07, false], ['folder', -0.15, 0.05, -0.05, false],
    ['notebook', 2.15, -0.35, 0.09, false], ['envelope', 2.45, 1.75, -0.08, false], ['card', -0.55, 2.3, 0.14, false],
    ['keycard', 0.75, 2.4, -0.12, false], ['postcard', -2.7, 2.6, -0.06, false],
    ['bag', -4.7, -2.0, 0.35, true], ['mug', 4.3, -1.9, -0.35, true], ['calendar', 4.5, 0.9, -0.5, true]
  ];
  var SETS = [
    { name: 'Айвори', note: 'Светлая основа, логотип золотой фольгой', base: 'ivory', logo: 'gold', coat: 'matte' },
    { name: 'Бордо', note: 'Тёмная основа, логотип золотой фольгой', base: 'bordeaux', logo: 'gold', coat: 'matte' },
    { name: 'Песок', note: 'Песочная основа, логотип печатью в бордо', base: 'sand', logo: 'print', coat: 'matte' }
  ];
  var si = Math.max(0, Math.min(SETS.length - 1, (parseInt(new URLSearchParams(location.search).get('set'), 10) || 1) - 1));
  var bar = $('bar'), sbtns = SETS.map(function (s, i) {
    var b = document.createElement('button'); b.type = 'button'; b.className = 'toggle-button toggle-button--sm toggle-button--ghost';
    b.innerHTML = '<i class="sw-mini" style="background:' + P.hexOf(s.base) + '"></i><span class="lbl">' + s.name + '</span>'; b.setAttribute('aria-label', s.name);
    b.addEventListener('click', function () { si = i; apply(); }); bar.insertBefore(b, bar.firstChild.nextSibling ? bar.children[i] : null); return b;
  });
  $('cnt').textContent = LAYOUT.length + ' носителей';
  $('studio').addEventListener('click', function () {
    var on = document.documentElement.getAttribute('data-studio') !== 'dark';
    if (on) document.documentElement.setAttribute('data-studio', 'dark'); else document.documentElement.removeAttribute('data-studio');
    $('studio').setAttribute('aria-pressed', on ? 'true' : 'false'); try { localStorage.setItem('palazzo-studio', on ? '1' : ''); } catch (e) {}
  });
  try { if (localStorage.getItem('palazzo-studio') === '1') $('studio').click(); } catch (e) {}
  P.syncSelected();

  var cv = $('gl'), renderer, stage;
  if (P.webgl() && T) { try { renderer = P.makeRenderer(cv, 4, 4); stage = P.makeScene(renderer, 2048); } catch (e) { renderer = null; } }
  if (!renderer) { $('nogl').hidden = false; paint(); return; }
  stage.shadow.visible = false; stage.hemi.intensity = 0.3; stage.key.intensity = 0.26;   // носители лежат лицом к свету — он здесь мягче
  var table = new T.Group(), need = true, picks = []; stage.scene.add(table);
  function paint() { sbtns.forEach(function (b, i) { b.setAttribute('aria-pressed', i === si ? 'true' : 'false'); }); $('note').textContent = SETS[si].note; }
  function apply() {
    paint();
    try { history.replaceState(null, '', location.pathname + '?set=' + (si + 1)); } catch (e) {}
    while (table.children.length) { var o = table.children[0]; table.remove(o); P.dispose(o); }
    picks = [];
    LAYOUT.forEach(function (l) {
      var it = P.item(l[0]), s = SETS[si], h = P.build(it, { base: it.fixedBase || s.base, logo: s.logo, coat: s.coat }, function () { need = true; });
      h.rotation.set(l[4] ? 0 : -Math.PI / 2, l[3], 0, 'YXZ'); h.position.set(l[1], 0, l[2]); h.updateMatrixWorld(true);
      h.position.y = -new T.Box3().setFromObject(h).min.y + 0.002;
      h.traverse(function (m) { if (m.isMesh) { m.castShadow = true; m.userData.item = it; picks.push(m); } });
      table.add(h);
    });
    need = true;
  }
  var yaw = 0, ty = 0, zoom = 1, tz = 1;
  function size() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2), w = Math.round(cv.clientWidth * dpr), h = Math.round(cv.clientHeight * dpr);
    if (w && h && (cv.width !== w || cv.height !== h)) { renderer.setSize(w, h, false); need = true; }
  }
  function render() {
    var a = cv.width / cv.height, tall = a < 1, d = (tall ? 21.5 * Math.max(1, 0.8 / a) : 18.5 * Math.max(1, 1.55 / a)) / zoom, el = tall ? 1.0 : 0.9;
    stage.cam.fov = 30; stage.cam.aspect = a; stage.cam.position.set(0, Math.sin(el) * d, Math.cos(el) * d); stage.cam.lookAt(0, 0, tall ? 0 : -0.7); stage.cam.updateProjectionMatrix();
    table.rotation.y = yaw; P.lightFor(stage, 6.2, 0); renderer.render(stage.scene, stage.cam);
  }
  function zoomBy(k) { tz = Math.max(0.6, Math.min(3, tz * k)); }
  $('zin').addEventListener('click', function () { zoomBy(1.2); }); $('zout').addEventListener('click', function () { zoomBy(1 / 1.2); });
  cv.addEventListener('wheel', function (e) { e.preventDefault(); zoomBy(e.deltaY < 0 ? 1.08 : 1 / 1.08); }, { passive: false });
  var pts = {}, pinch = 0, moved = 0, ray = new T.Raycaster();
  cv.addEventListener('pointerdown', function (e) { pts[e.pointerId] = [e.clientX, e.clientY]; cv.setPointerCapture(e.pointerId); cv.classList.add('grabbing'); moved = 0; });
  cv.addEventListener('pointermove', function (e) {
    var p = pts[e.pointerId]; if (!p) return; var ids = Object.keys(pts);
    if (ids.length === 2) { pts[e.pointerId] = [e.clientX, e.clientY]; var a = pts[ids[0]], b = pts[ids[1]], d = Math.hypot(a[0] - b[0], a[1] - b[1]); if (pinch) zoomBy(d / pinch); pinch = d; moved = 99; return; }
    var dx = e.clientX - p[0]; pts[e.pointerId] = [e.clientX, e.clientY]; moved += Math.abs(dx) + Math.abs(e.clientY - p[1]); ty += dx * 0.006;
  });
  function up(e) {
    if (!pts[e.pointerId]) return; delete pts[e.pointerId]; pinch = 0; if (!Object.keys(pts).length) cv.classList.remove('grabbing');
    if (e.type === 'pointerup' && moved < 6) {                     // нажатие без перетаскивания открывает носитель
      var r = cv.getBoundingClientRect(); ray.setFromCamera({ x: (e.clientX - r.left) / r.width * 2 - 1, y: -(e.clientY - r.top) / r.height * 2 + 1 }, stage.cam);
      var hit = ray.intersectObjects(picks, false)[0]; if (hit) location.href = P.href(hit.object.userData.item);
    }
  }
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  if (cv.clientWidth < cv.clientHeight) { yaw = ty = -Math.PI / 2; }   // на вертикальном экране стол повёрнут длинной стороной вглубь
  paint();
  P.preload().then(function () {
  apply();
  var last = 0, still = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  (function tick(now) {
    requestAnimationFrame(tick); var dt = Math.min(0.05, ((now || 0) - last) / 1000); last = now || 0; size();
    var k = still ? 1 : Math.min(1, dt * 9);
    if (Math.abs(ty - yaw) + Math.abs(tz - zoom) > 0.0005) { yaw += (ty - yaw) * k; zoom += (tz - zoom) * k; need = true; }
    if (need && cv.width > 8) { render(); need = false; }
  })(0);
  });
})();
</script>
